name: Audit player reads

on: [push]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decompile Minecraft locally
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew genSources --stacktrace 2>&1 | tee gen.log | tail -n 40

      - name: Extract player reads (member names only)
        shell: bash
        run: |
          find ~/.gradle .gradle -name '*sources*.jar' 2>/dev/null | grep -i -E 'minecraft|neoforge' | tee jars.txt
          python3 .github/audit/player_reads.py $(cat jars.txt) > audit.txt
          wc -l -c audit.txt

      # Raw job logs are not always reachable, so the result is published as annotations.
      - name: Publish result as annotations
        if: always()
        shell: bash
        run: |
          python3 - <<'EOF'
          import os
          text = open("audit.txt").read() if os.path.exists("audit.txt") else ""
          if not text:
              text = "AUDIT EMPTY\n" + (open("jars.txt").read() if os.path.exists("jars.txt") else "no jars.txt") \
                     + "\n" + (open("gen.log").read()[-6000:] if os.path.exists("gen.log") else "")
          lines, chunks, cur = text.splitlines(True), [], ""
          for line in lines:
              if len(cur) + len(line) > 7500:
                  chunks.append(cur); cur = ""
              cur += line
          if cur: chunks.append(cur)
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          kinds = ["notice"] * 10 + ["warning"] * 10 + ["error"] * 10
          for n, (kind, chunk) in enumerate(zip(kinds, chunks), 1):
              print(f"::{kind} title=audit {n}/{len(chunks)}::{esc(chunk)}")
          if len(chunks) > len(kinds):
              print(f"::error title=audit truncated::{len(chunks)} chunks, only {len(kinds)} published")
          EOF
